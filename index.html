    <script>
      // Thème appliqué avant le premier affichage (pas de flash) — même clé que src/theme.tsx
      (function () {
        try {
          var t = localStorage.getItem('echo_data_analyst_theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
